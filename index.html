<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Access Portal</title>
    <style>
       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Hiragino Mincho ProN","MS Mincho",serif;
    background: radial-gradient(circle at center, #1b1f24 0%, #0f0f0f 80%);
    color: #d8d8d8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.intro-container {
    text-align: center;
    max-width: 650px;
    padding: 60px 50px;
    background: rgba(34, 34, 34, 0.3);
    border: 1px solid rgba(255,255,255,0.05);
    backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
}

/* 光る枠演出 */
.intro-container::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid rgba(255,255,255,0.05);
    pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.2));
}

.intro-title {
    font-size: 1.9rem;
    color: #e6e6e6;
    letter-spacing: 0.15em;
    margin-bottom: 35px;
    line-height: 1.6;
    text-shadow: 0 0 10px rgba(200,255,255,0.2);
}

.intro-subtitle {
    font-size: 1rem;
    color: #9da5ad;
    margin-bottom: 55px;
    line-height: 1.9;
}

.proceed-btn {
    background: rgba(20, 20, 20, 0.8);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(0,255,255,0.2);
    color: #d8d8d8;
    padding: 15px 60px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.15em;
    text-transform: uppercase;
}

.proceed-btn:hover {
    background: rgba(0,255,255,0.12);
    border-color: rgba(0,255,255,0.4);
    box-shadow: 0 0 12px rgba(0,255,255,0.35);
}

@media (max-width: 600px) {
    .intro-container {
        padding: 45px 30px;
    }
    .intro-title {
        font-size: 1.4rem;
    }
    .intro-subtitle {
        font-size: 0.9rem;
    }
}

    </style>
</head>
<body>
    <div class="intro-container">
        <h1 class="intro-title">Liminal Space脱出口生成フォームへようこそ</h1>
        <p class="intro-subtitle">
            このシステムは狭間空間からの出口を生成するための特殊なフォームです。<br>
            60枚の画像の中から正しいドアの画像を選択し、送信してください。
        </p>
        <button class="proceed-btn" onclick="proceedToForm()">進む</button>
    </div>

    <script>
        function proceedToForm() {
            // 実際のフォームページに遷移
            window.location.href = 'https://hazamashobo.github.io/door/index.html'; // フォームページのファイル名に変更してください
        }
    </script>
</body>
</html>
