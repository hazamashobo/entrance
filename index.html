<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Access Portal</title>
    <style>
       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Hiragino Mincho ProN","MS Mincho",serif;
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 20px;
}

/* 背景ノイズ */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(0,255,255,0.05) 0px,
            rgba(0,255,255,0.05) 1px,
            rgba(0,0,0,0) 2px
        );
    opacity: 0.08;
    pointer-events: none;
}

/* フェードイン */
.fade-in {
    animation: fadeIn 1.8s ease forwards;
    opacity: 0;
}

@keyframes fadeIn {
    0% { opacity: 0; transform: translateY(20px); }
    80% { opacity: .8; }
    100% { opacity: 1; transform: translateY(0); }
}

.intro-container {
    text-align: center;
    max-width: 650px;
    padding: 60px 50px;
    background: rgba(20, 20, 25, 0.35);
    border: 1px solid rgba(0,255,255,0.08);
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
    animation: fadeIn 2.2s ease forwards;
}

/* 発光縁 */
.intro-container::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid rgba(0,255,255,0.08);
    pointer-events: none;
    box-shadow: 0 0 30px rgba(0,255,255,0.15);
}

.intro-title {
    font-size: 1.9rem;
    color: #e6e6e6;
    letter-spacing: 0.15em;
    margin-bottom: 35px;
    line-height: 1.6;
    text-shadow: 0 0 12px rgba(0,255,255,0.25);
    animation: titlePulse 2.5s infinite alternate ease-in-out;
}

/* 不穏な微振動 */
@keyframes titlePulse {
    0% { transform: translateX(0); }
    100% { transform: translateX(1.2px); }
}

.intro-subtitle {
    font-size: 1rem;
    color: #a0a7ad;
    margin-bottom: 55px;
    line-height: 1.9;
}

.proceed-btn {
    background: rgba(0, 10, 15, 0.8);
    backdrop-filter: blur(5px);
    border: 1px solid rgba(0,255,255,0.3);
    color: #cde;
    padding: 15px 60px;
    font-size: 1.1rem;
    cursor: pointer;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: all 0.25s ease;
    opacity: 0;
    animation: fadeIn 2.8s ease forwards;
}

.proceed-btn:hover {
    background: rgba(0,255,255,0.12);
    border-color: rgba(0,255,255,0.45);
    box-shadow: 0 0 16px rgba(0,255,255,0.4);
}

@media (max-width: 600px) {
    .intro-container {
        padding: 45px 30px;
    }
    .intro-title {
        font-size: 1.4rem;
    }
    .intro-subtitle {
        font-size: 0.9rem;
    }
}

    </style>
</head>
<body>
    <div class="intro-container fade-in">
        <h1 class="intro-title">Liminal Space脱出口生成フォームへようこそ</h1>
        <p class="intro-subtitle">
            このシステムは狭間空間からの出口を生成するための特殊なフォームです。<br>
            60枚の画像の中から正しいドアの画像を選択し、送信してください。
        </p>
        <button class="proceed-btn" onclick="proceedToForm()">進む</button>
    </div>

    <script>
        function proceedToForm() {
            // 実際のフォームページに遷移
            window.location.href = 'https://hazamashobo.github.io/door/index.html'; // フォームページのファイル名に変更してください
        }
    </script>
</body>
</html>
